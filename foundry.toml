# Solidity compiler settings must match hardhat.config.ts (Hardhat is source of truth):
# solc 0.8.28, optimizer on / runs 200, via_ir true, evm cancun (Mezo mainnet RPC-verified).
#
# OpenZeppelin is pinned to v5.4.x in package.json for dependency stability;
# Cancun is allowed at the solc/hardfork layer so forked Mezo contracts (PUSH0) run.
[profile.default]
src = "src"
out = "out"
test = "test"
cache_path = "cache_forge"
libs = ["lib", "node_modules"]
auto_detect_solc = false
offline = false
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_remappings = false
remappings = [
  # Prefer the Foundry lib pin (v5.4.0). node_modules is an equivalent fallback at 5.4.0.
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/"
]
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC_URL}"

[etherscan]
testnet = { key = "empty", chain = 31611, url = "https://api.explorer.test.mezo.org/api" }
mainnet = { key = "empty", chain = 31612, url = "https://api.explorer.mezo.org/api" }

[invariant]
runs = 32
depth = 20
fail_on_revert = false
call_override = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
multiline_func_header = 'attributes_first'
quote_style = 'double'
sort_imports = false
